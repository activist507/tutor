<!DOCTYPE html>
<html>
<head>
	<title>Second - Page</title>

    .box {
      padding: 20px 0px 20px 30px;

  <div>
    <p class="box">This is a paragraph</p>
    <p id="other-tag"> This is the second paragraph</p>
  </div>

</body>
</html>
