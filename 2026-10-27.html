<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Media Queries</title>
	<style>
		nav ul {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		@media (min-width: 768px) {
			nav ul { flex-direction: row; gap: 24px; }
		}
	</style>
</head>
<body>
	<nav>
		<ul>
			<li>Home</li>
			<li>About</li>
			<li>Contact</li>
			<li>FAQs</li>
		</ul>
	</nav>
</body>
</html>
